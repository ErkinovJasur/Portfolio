<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="currBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="rateGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#currBg)"/>

  <!-- Glowing chart in background -->
  <path d="M 50,300 Q 150,280 250,220 T 450,140 T 560,90" fill="none" stroke="url(#rateGrad)" stroke-width="4" filter="drop-shadow(0 0 12px #10b981)"/>
  <circle cx="560" cy="90" r="7" fill="#34d399"/>

  <!-- Currency Converter UI Window -->
  <rect x="140" y="45" width="320" height="270" rx="20" fill="rgba(15,23,42,0.9)" stroke="rgba(16,185,129,0.3)" stroke-width="1.5"/>
  
  <text x="170" y="80" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="1">CURRENCY CONVERTER</text>
  
  <!-- From Input -->
  <rect x="170" y="95" width="260" height="50" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
  <text x="185" y="127" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">100.00</text>
  <rect x="360" y="105" width="60" height="30" rx="6" fill="#10b981"/>
  <text x="372" y="125" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">USD 🇺🇸</text>

  <!-- Swap icon circle -->
  <circle cx="300" cy="165" r="16" fill="#10b981" filter="drop-shadow(0 0 8px #10b981)"/>
  <text x="294" y="170" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">⇅</text>

  <!-- To Input -->
  <rect x="170" y="185" width="260" height="50" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
  <text x="185" y="217" fill="#34d399" font-family="sans-serif" font-size="18" font-weight="bold">1,285,000</text>
  <rect x="360" y="195" width="60" height="30" rx="6" fill="#0284c7"/>
  <text x="372" y="215" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">UZS 🇺🇿</text>

  <!-- Rate footer -->
  <text x="170" y="275" fill="#94a3b8" font-family="sans-serif" font-size="12">1 USD = 12,850.00 UZS (Live Central Bank)</text>
</svg>
