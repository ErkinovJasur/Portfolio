<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="realGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#realGrad)"/>

  <!-- Modern House Illustration in background -->
  <polygon points="320,120 480,50 560,100 400,170" fill="#6366f1" opacity="0.6"/>
  <polygon points="320,120 400,170 400,280 320,220" fill="#4338ca" opacity="0.8"/>
  <polygon points="400,170 560,100 560,200 400,280" fill="#312e81" opacity="0.9"/>
  <!-- Glowing windows -->
  <polygon points="430,175 510,140 510,185 430,220" fill="#fef08a" opacity="0.85" filter="drop-shadow(0 0 15px #eab308)"/>

  <!-- Real Estate UI Card -->
  <rect x="45" y="45" width="290" height="270" rx="20" fill="rgba(15,23,42,0.85)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  
  <rect x="65" y="65" width="85" height="24" rx="6" fill="#a855f7"/>
  <text x="75" y="81" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">FOR SALE</text>
  
  <text x="65" y="125" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">Luxury Villa Oasis</text>
  <text x="65" y="148" fill="#94a3b8" font-family="sans-serif" font-size="13">Amir Temur Ave, Tashkent</text>
  
  <text x="65" y="200" fill="#38bdf8" font-family="sans-serif" font-size="28" font-weight="800">$450,000</text>

  <!-- Amenities Badges -->
  <g transform="translate(65, 230)">
    <rect x="0" y="0" width="75" height="35" rx="8" fill="rgba(255,255,255,0.08)"/>
    <text x="12" y="22" fill="#cbd5e1" font-family="sans-serif" font-size="12">🛏️ 4 Beds</text>
    
    <rect x="85" y="0" width="75" height="35" rx="8" fill="rgba(255,255,255,0.08)"/>
    <text x="97" y="22" fill="#cbd5e1" font-family="sans-serif" font-size="12">🚿 3 Baths</text>
    
    <rect x="170" y="0" width="80" height="35" rx="8" fill="rgba(255,255,255,0.08)"/>
    <text x="180" y="22" fill="#cbd5e1" font-family="sans-serif" font-size="12">📐 380 m²</text>
  </g>
</svg>
