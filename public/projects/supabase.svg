<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06070C"/>
      <stop offset="1" stop-color="#0B1424"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4F7CFF"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#34D399"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="85"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>
  <circle cx="240" cy="160" r="240" fill="#4F7CFF" opacity="0.26" filter="url(#blur)"/>
  <circle cx="1010" cy="560" r="240" fill="#34D399" opacity="0.16" filter="url(#blur)"/>
  <circle cx="620" cy="80" r="200" fill="#A855F7" opacity="0.14" filter="url(#blur)"/>

  <g opacity="0.5" stroke="#ffffff" stroke-opacity="0.06">
    <path d="M0 140H1200M0 280H1200M0 420H1200M0 560H1200"/>
    <path d="M150 0V700M300 0V700M450 0V700M600 0V700M750 0V700M900 0V700M1050 0V700"/>
  </g>

  <g transform="translate(150 112)">
    <rect x="20" y="40" width="500" height="320" rx="24" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.1" transform="rotate(-4 270 200)"/>
    <rect x="380" y="90" width="380" height="300" rx="24" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.12" transform="rotate(5 570 240)"/>

    <rect width="620" height="400" rx="26" fill="#080B14" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect width="620" height="46" rx="26" fill="#ffffff" fill-opacity="0.04"/>
    <rect y="22" width="620" height="24" fill="#ffffff" fill-opacity="0.04"/>
    <circle cx="26" cy="23" r="5.5" fill="#F87171"/>
    <circle cx="46" cy="23" r="5.5" fill="#FBBF24"/>
    <circle cx="66" cy="23" r="5.5" fill="#34D399"/>

    <rect x="28" y="72" width="152" height="26" rx="8" fill="#111827" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="42" y="89" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="11">src / lib / supabase.ts</text>

    <g font-family="'SFMono-Regular', Consolas, monospace" font-size="13">
      <text x="30" y="138" fill="#64748B">01</text>
      <text x="58" y="138" fill="#C084FC">import</text>
      <text x="116" y="138" fill="#E2E8F0">{ createClient }</text>
      <text x="244" y="138" fill="#C084FC">from</text>
      <text x="284" y="138" fill="#34D399">'@supabase/supabase-js'</text>

      <text x="30" y="170" fill="#64748B">02</text>
      <text x="58" y="170" fill="#64748B">// env variables</text>

      <text x="30" y="202" fill="#64748B">03</text>
      <text x="58" y="202" fill="#C084FC">const</text>
      <text x="106" y="202" fill="#60A5FA">supabase</text>
      <text x="178" y="202" fill="#E2E8F0">=</text>
      <text x="196" y="202" fill="#E2E8F0">createClient(</text>

      <text x="30" y="234" fill="#64748B">04</text>
      <text x="72" y="234" fill="#E2E8F0">import.meta.env.VITE_URL,</text>

      <text x="30" y="266" fill="#64748B">05</text>
      <text x="72" y="266" fill="#E2E8F0">import.meta.env.VITE_ANON_KEY</text>

      <text x="30" y="298" fill="#64748B">06</text>
      <text x="58" y="298" fill="#E2E8F0">);</text>

      <text x="30" y="330" fill="#64748B">07</text>
      <text x="58" y="330" fill="#C084FC">export default</text>
      <text x="164" y="330" fill="#60A5FA">supabase</text>
    </g>
    <rect x="30" y="352" width="560" height="1" fill="#ffffff" fill-opacity="0.06"/>
    <circle cx="46" cy="376" r="5" fill="#34D399"/>
    <text x="60" y="380" fill="#34D399" font-family="Inter, Arial, sans-serif" font-size="11">Connected · Database ready</text>
    <text x="510" y="380" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="11">TypeScript</text>
  </g>

  <g transform="translate(810 150)">
    <rect width="270" height="270" rx="30" fill="#0A1114" stroke="#34D399" stroke-opacity="0.25"/>
    <g transform="translate(85 55)">
      <path d="M50 0L93 22V83L50 110L7 83V22L50 0Z" fill="#34D399" fill-opacity="0.14" stroke="#34D399" stroke-opacity="0.5"/>
      <path d="M50 22L74 34.5V60C74 76 63 88 50 94C37 88 26 76 26 60V34.5L50 22Z" fill="url(#green)" fill-opacity="0.9"/>
      <path d="M50 34L62 40.5V60C62 69 57 76 50 80C43 76 38 69 38 60V40.5L50 34Z" fill="#06120E"/>
    </g>
    <text x="135" y="205" text-anchor="middle" fill="#ECFDF5" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Supabase</text>
    <text x="135" y="228" text-anchor="middle" fill="#6EE7B7" font-family="Inter, Arial, sans-serif" font-size="11" opacity="0.8">Auth · Database · Storage</text>
  </g>

  <text x="120" y="620" fill="#E2E8F0" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">React + Tailwind + Supabase</text>
  <text x="120" y="648" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="13">A clean starter stack for modern web apps.</text>

  <g transform="translate(810 490)" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600">
    <rect width="88" height="30" rx="15" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="20" y="19" fill="#93C5FD">React</text>
    <rect x="98" width="106" height="30" rx="15" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="116" y="19" fill="#6EE7B7">Tailwind</text>
    <rect x="214" width="96" height="30" rx="15" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="230" y="19" fill="#C084FC">Supabase</text>
  </g>
</svg>
