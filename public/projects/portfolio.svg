<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="portBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#portBg)"/>

  <!-- Star particles -->
  <circle cx="80" cy="50" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="220" cy="40" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="480" cy="60" r="1.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="530" cy="180" r="2" fill="#e0e7ff" opacity="0.7"/>
  <circle cx="90" cy="300" r="2.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="520" cy="310" r="1.5" fill="#ffffff" opacity="0.6"/>

  <!-- Portfolio Website Preview Window -->
  <rect x="75" y="45" width="450" height="270" rx="18" fill="rgba(15,23,42,0.9)" stroke="rgba(168,85,247,0.3)" stroke-width="1.5"/>
  
  <!-- Top bar -->
  <rect x="75" y="45" width="450" height="40" rx="18" fill="rgba(30,41,59,0.7)"/>
  <circle cx="98" cy="65" r="5" fill="#ef4444"/>
  <circle cx="113" cy="65" r="5" fill="#f59e0b"/>
  <circle cx="128" cy="65" r="5" fill="#10b981"/>
  <rect x="200" y="53" width="200" height="24" rx="12" fill="rgba(0,0,0,0.3)"/>
  <text x="240" y="69" fill="#94a3b8" font-family="sans-serif" font-size="11">https://jasur.dev</text>

  <!-- Hero Content inside Mockup -->
  <rect x="250" y="105" width="100" height="20" rx="10" fill="rgba(168,85,247,0.2)"/>
  <text x="260" y="119" fill="#c084fc" font-family="sans-serif" font-size="9" font-weight="bold">Mars IT School</text>
  
  <text x="140" y="160" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="800">Erkinov <tspan fill="url(#logoGrad)">Jasur</tspan></text>
  <text x="190" y="185" fill="#94a3b8" font-family="sans-serif" font-size="13">Frontend Developer &amp; React Specialist</text>

  <!-- Buttons inside mockup -->
  <rect x="190" y="210" width="100" height="32" rx="8" fill="url(#logoGrad)"/>
  <text x="208" y="231" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">View Work</text>

  <rect x="305" y="210" width="100" height="32" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)"/>
  <text x="323" y="231" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="bold">Contact Me</text>
</svg>
