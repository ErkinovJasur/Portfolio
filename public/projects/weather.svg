<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bgGrad)"/>
  
  <!-- Ambient clouds & weather artwork -->
  <circle cx="440" cy="110" r="55" fill="url(#sunGrad)" opacity="0.9" filter="drop-shadow(0 0 25px #f59e0b)"/>
  <path d="M 360,170 Q 380,120 440,130 Q 490,120 510,160 Q 540,165 540,195 Q 540,225 500,225 L 360,225 Q 330,225 330,195 Q 330,170 360,170 Z" fill="#38bdf8" opacity="0.35"/>
  <path d="M 330,180 Q 350,140 400,150 Q 440,140 460,175 Q 485,180 485,205 Q 485,230 450,230 L 330,230 Q 305,230 305,205 Q 305,180 330,180 Z" fill="#e0f2fe" opacity="0.85"/>

  <!-- Weather UI Glass Card -->
  <rect x="50" y="50" width="280" height="260" rx="20" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  
  <!-- Location & Temp -->
  <text x="75" y="90" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="600" letter-spacing="1">CURRENT LOCATION</text>
  <text x="75" y="120" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold">Tashkent, UZ</text>
  <text x="75" y="195" fill="#ffffff" font-family="sans-serif" font-size="64" font-weight="800">28°</text>
  <text x="180" y="165" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="600">Sunny</text>
  <text x="180" y="190" fill="#94a3b8" font-family="sans-serif" font-size="13">H: 32° L: 19°</text>

  <!-- Forecast bar -->
  <rect x="75" y="235" width="230" height="50" rx="12" fill="rgba(0,0,0,0.3)"/>
  <text x="90" y="265" fill="#94a3b8" font-family="sans-serif" font-size="12">Humidity: 38%</text>
  <text x="210" y="265" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">Wind: 14 km/h</text>
</svg>
